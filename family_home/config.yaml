name: Family Home
version: "0.1.34"
slug: family_home
description: Private family room controls with per-user administration
url: https://github.com/davidabuch/Family_Home
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
homeassistant_api: true
host_network: false
ports:
  8099/tcp: 8102
ports_description:
  8099/tcp: Family Home web interface (LAN/VPN only)
webui: http://[HOST]:[PORT:8099]
options:
  session_secret: ""
  admin_username: ""
  admin_password: ""
  proxy_secret: ""
  trusted_proxy_ips: ""
  public_origin: "https://home-local.davidbuchmd.com"
  remote_origin: ""
schema:
  session_secret: password
  admin_username: str?
  admin_password: password?
  proxy_secret: password
  trusted_proxy_ips: str?
  public_origin: str
  remote_origin: str?
