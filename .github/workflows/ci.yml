name: Family Home CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved icon derivatives
        run: |
          pip install Pillow==11.3.0
          python scripts/generate_icons.py --check
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check family_home/start.mjs
          node --check lib/permissions.js
          node --check public/admin.js
          node --check lib/auth.js
          node --check lib/database.js
          node --check lib/profiles.js
          node --check lib/admin.js
      - name: Family Home regression tests
        run: npm test
      - name: Reproduce stale image cache and verify version-keyed packaging
        run: python3 scripts/test_build_cache.py
